apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tiered-node-scheduler.fullname" . }}-lease
  namespace: {{ .Values.leaderElection.resourceNamespace | default .Release.Namespace }}
  labels:
    {{- include "tiered-node-scheduler.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tiered-node-scheduler.fullname" . }}-lease
subjects:
  - kind: ServiceAccount
    name: {{ include "tiered-node-scheduler.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
