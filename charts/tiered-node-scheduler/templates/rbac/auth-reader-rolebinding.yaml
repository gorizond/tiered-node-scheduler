apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tiered-node-scheduler.fullname" . }}-auth-reader
  namespace: kube-system
  labels:
    {{- include "tiered-node-scheduler.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "tiered-node-scheduler.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
