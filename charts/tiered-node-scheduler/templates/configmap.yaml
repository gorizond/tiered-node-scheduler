apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tiered-node-scheduler.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tiered-node-scheduler.labels" . | nindent 4 }}
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: {{ .Values.leaderElection.leaderElect }}
      resourceNamespace: {{ .Values.leaderElection.resourceNamespace | quote }}
      resourceName: {{ .Values.leaderElection.resourceName | quote }}
    profiles:
      - schedulerName: {{ .Values.schedulerName | quote }}
        plugins:
          filter:
            enabled:
              - name: TieredNodeFallback
        pluginConfig:
          - name: TieredNodeFallback
            args:
              fallbackTimeoutSeconds: {{ .Values.pluginConfig.fallbackTimeoutSeconds }}
              primaryNodeLabelKey: {{ .Values.pluginConfig.primaryNodeLabelKey | quote }}
              primaryNodeLabelValue: {{ .Values.pluginConfig.primaryNodeLabelValue | quote }}
